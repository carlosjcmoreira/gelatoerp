{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-3">
    <div class="login-container">
        <div class="text-center mb-4">
            <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
                <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="100" height="100" rx="22" ry="22" fill="#1A7A6E"/>
                    <path d="M50 78 C34 78 22 65 22 50 C22 35 35 22 50 22 C65 22 78 35 78 50 C78 65 66 78 50 78 Z" fill="#FFF8F2"/>
                    <ellipse cx="50" cy="48" rx="14" ry="12" fill="#2BB5A0" opacity="0.7"/>
                    <rect x="44" y="74" width="12" height="16" rx="4" fill="#FFF8F2" opacity="0.9"/>
                </svg>
                <h1 class="display-6 fw-bold mb-0">Scoopy</h1>
            </div>
            <p class="text-muted">Controlo de Rentabilidade</p>
        </div>

        <hr>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Utilizador</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
