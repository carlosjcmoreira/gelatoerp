{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-3">
    <div class="login-container">
        <div class="text-center mb-4">
            <h1 class="display-6 fw-bold">🍦 Nivà Porto</h1>
            <p class="text-muted">Controlo de Rentabilidade</p>
        </div>

        <hr>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Utilizador</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
