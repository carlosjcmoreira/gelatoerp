<div class="card mb-3">
    <div class="card-body">
        <h6 class="card-title">Produtos de Confeitaria</h6>
        {% if produtos_conf %}
        {% for p in produtos_conf %}
        <div class="d-flex justify-content-between align-items-center border-bottom py-1">
            <span class="small">• {{ p.nome }}</span>
            <form method="POST" class="d-inline">
                <input type="hidden" name="action" value="delete_produto_conf">
                <input type="hidden" name="section" value="produtos_confeitaria">
                <input type="hidden" name="produto_conf_id" value="{{ p.id }}">
                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Eliminar?')">✕</button>
            </form>
        </div>
        {% endfor %}
        {% else %}
        <p class="text-muted small">Sem produtos registados.</p>
        {% endif %}
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <h6 class="card-title">Adicionar Novo Produto</h6>
        <form method="POST">
            <input type="hidden" name="action" value="add_produto_conf">
            <input type="hidden" name="section" value="produtos_confeitaria">
            <div class="mb-2">
                <input type="text" name="novo_prod_conf" class="form-control form-control-sm" placeholder="Ex: Cookie Morango">
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Adicionar Produto</button>
        </form>
    </div>
</div>
