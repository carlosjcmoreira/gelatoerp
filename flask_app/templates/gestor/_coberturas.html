<div class="card mb-3">
    <div class="card-body">
        <h6 class="card-title">Coberturas</h6>
        <p class="text-muted small">Lista de coberturas disponíveis para produtos de pastelaria.</p>
        {% if coberturas %}
        {% for c in coberturas %}
        <div class="d-flex justify-content-between align-items-center border-bottom py-1">
            <span class="small">{% if c.ativo %}✅{% else %}❌{% endif %} {{ c.nome }}</span>
            <form method="POST" class="d-inline">
                <input type="hidden" name="action" value="delete_cobertura">
                <input type="hidden" name="section" value="coberturas">
                <input type="hidden" name="cobertura_id" value="{{ c.id }}">
                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Eliminar?')">✕</button>
            </form>
        </div>
        {% endfor %}
        {% else %}
        <p class="text-muted small">Sem coberturas registadas.</p>
        {% endif %}
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <h6 class="card-title">Adicionar Nova Cobertura</h6>
        <form method="POST">
            <input type="hidden" name="action" value="add_cobertura">
            <input type="hidden" name="section" value="coberturas">
            <div class="mb-2">
                <input type="text" name="nova_cobertura" class="form-control form-control-sm" placeholder="Ex: Cobertura branca">
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Adicionar Cobertura</button>
        </form>
    </div>
</div>
