<div class="card mb-3">
    <div class="card-body">
        <h6 class="card-title">Produtos para Receção</h6>
        {% if produtos_rec %}
        {% for p in produtos_rec %}
        <div class="d-flex justify-content-between align-items-center border-bottom py-1">
            <div class="small">
                <span>• {{ p.nome }}</span>
                <span class="text-muted">({{ p.tipo }})</span>
            </div>
            <form method="POST" class="d-inline">
                <input type="hidden" name="action" value="delete_produto_rec">
                <input type="hidden" name="section" value="produtos_rececao">
                <input type="hidden" name="produto_rec_id" value="{{ p.id }}">
                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Eliminar?')">✕</button>
            </form>
        </div>
        {% endfor %}
        {% else %}
        <p class="text-muted small">Sem produtos registados.</p>
        {% endif %}
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <h6 class="card-title">Adicionar Novo Produto</h6>
        <form method="POST">
            <input type="hidden" name="action" value="add_produto_rec">
            <input type="hidden" name="section" value="produtos_rececao">
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <input type="text" name="novo_prod_rec" class="form-control form-control-sm" placeholder="Ex: Taças">
                </div>
                <div class="col-6">
                    <select name="tipo_prod_rec" class="form-select form-select-sm">
                        <option value="embalagem">embalagem</option>
                        <option value="gelado">gelado</option>
                        <option value="pastelaria">pastelaria</option>
                        <option value="confeitaria">confeitaria</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Adicionar Produto</button>
        </form>
    </div>
</div>
