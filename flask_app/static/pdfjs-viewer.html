<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador PDF — Scoopy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#525659;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#toolbar{background:#323639;color:#fff;display:flex;align-items:center;gap:6px;padding:8px 12px;flex-shrink:0;flex-wrap:wrap;min-height:48px}
#toolbar .brand{font-size:0.75rem;opacity:0.6;font-weight:600;letter-spacing:.03em;white-space:nowrap}
#toolbar .sep{width:1px;height:20px;background:rgba(255,255,255,0.2);flex-shrink:0}
#toolbar .spacer{flex:1}
.tbtn{background:rgba(255,255,255,0.1);border:none;color:#fff;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:0.8rem;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tbtn:hover{background:rgba(255,255,255,0.25)}
.tbtn:disabled{opacity:0.4;cursor:default}
.page-info{font-size:0.8rem;color:rgba(255,255,255,0.8);white-space:nowrap;min-width:80px;text-align:center}
#viewer{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pdf-page-wrap{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
.pdf-page-wrap canvas{display:block;max-width:100%}
#state-msg{color:#fff;text-align:center;padding:60px 20px;font-size:1rem;opacity:0.85;width:100%}
#err-msg{color:#ff7b7b;text-align:center;padding:60px 20px;width:100%}
#err-msg a{color:#ffb3b3}
</style>
</head>
<body>
<div id="toolbar">
  <span class="brand">🍦 Scoopy</span>
  <div class="sep"></div>
  <button class="tbtn" id="btn-prev" onclick="goPage(-1)" disabled>‹ Ant.</button>
  <div class="page-info" id="page-info">…</div>
  <button class="tbtn" id="btn-next" onclick="goPage(1)" disabled>Próx. ›</button>
  <div class="sep"></div>
  <button class="tbtn" onclick="changeZoom(-0.25)">−</button>
  <div class="page-info" id="zoom-info">150%</div>
  <button class="tbtn" onclick="changeZoom(+0.25)">+</button>
  <div class="spacer"></div>
  <a class="tbtn" id="dl-link" href="#" download>⬇ Descarregar</a>
</div>
<div id="viewer"><div id="state-msg">A carregar PDF…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
        integrity="sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR9HFJmBfqbZL38ePBBGrMVYFhQxJF7VPdA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function() {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var params = new URLSearchParams(location.search);
  var fileUrl = params.get('file');

  if (!fileUrl) {
    document.getElementById('viewer').innerHTML =
      '<div id="err-msg">URL do PDF não especificado.</div>';
    return;
  }

  document.getElementById('dl-link').href = fileUrl;

  var pdf = null;
  var scale = 1.5;
  var currentPage = 1;
  var totalPages = 0;
  var rendering = false;

  function stateMsg(msg) {
    var v = document.getElementById('viewer');
    v.innerHTML = '<div id="state-msg">' + msg + '</div>';
  }

  function updateNav() {
    document.getElementById('page-info').textContent =
      'Pág. ' + currentPage + ' / ' + totalPages;
    document.getElementById('btn-prev').disabled = currentPage <= 1;
    document.getElementById('btn-next').disabled = currentPage >= totalPages;
    document.getElementById('zoom-info').textContent = Math.round(scale * 100) + '%';
  }

  function renderPage(pageNum) {
    if (!pdf || rendering) return;
    rendering = true;
    pdf.getPage(pageNum).then(function(page) {
      var vp = page.getViewport({scale: scale});
      var viewer = document.getElementById('viewer');
      viewer.innerHTML = '';

      var wrap = document.createElement('div');
      wrap.className = 'pdf-page-wrap';
      var canvas = document.createElement('canvas');
      canvas.width = vp.width;
      canvas.height = vp.height;
      wrap.appendChild(canvas);
      viewer.appendChild(wrap);

      page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise.then(function() {
        rendering = false;
        updateNav();
      });
    });
  }

  function goPage(delta) {
    var np = currentPage + delta;
    if (np < 1 || np > totalPages) return;
    currentPage = np;
    renderPage(currentPage);
  }

  function changeZoom(delta) {
    scale = Math.max(0.5, Math.min(3.0, scale + delta));
    document.getElementById('zoom-info').textContent = Math.round(scale * 100) + '%';
    renderPage(currentPage);
  }

  pdfjsLib.getDocument({url: fileUrl, withCredentials: true}).promise.then(function(doc) {
    pdf = doc;
    totalPages = doc.numPages;
    currentPage = 1;
    renderPage(currentPage);
  }).catch(function(err) {
    document.getElementById('viewer').innerHTML =
      '<div id="err-msg">' +
      '<p style="font-size:1.2rem;margin-bottom:12px">Não foi possível carregar o PDF.</p>' +
      '<p style="opacity:0.7;font-size:0.85rem;margin-bottom:16px">' + String(err) + '</p>' +
      '<a href="' + fileUrl + '" class="tbtn" download style="display:inline-block">⬇ Tentar descarregar o ficheiro</a>' +
      '</div>';
  });

  window.goPage = goPage;
  window.changeZoom = changeZoom;
})();
</script>
</body>
</html>
